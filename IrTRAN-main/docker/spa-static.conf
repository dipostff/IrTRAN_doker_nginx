server {
    listen       80;
    server_name  localhost;
    root         /usr/share/nginx/html;
    index        index.html;

    gzip on;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml;

    # Именованные файлы Vite (/assets/*.js) — можно кешировать навсегда (имя файла меняется при сборке).
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Главную и любые SPA-URL не кешировать: иначе после деплоя остаётся старый index → старые чанки и снова /import + 504.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, Pragma: no-cache" always;
    }

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, Pragma: no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
