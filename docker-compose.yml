# Электронный тренажер IrTRAN: БД, Keycloak, бэкенд, фронт (опционально)
# Примечание: атрибут version в docker-compose больше не используется и удалён
# Запуск: docker-compose up -d
# Локальная разработка: см. README — backend (node app.js), frontend (npm run dev)

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-irtran}
      MYSQL_USER: ${MYSQL_USER:-irtran}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-irtran}
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HOSTNAME: ${KC_HOSTNAME:-localhost}
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: 8080
      KC_HTTP_RELATIVE_PATH: /auth
      # Иначе :9000/health и часть проверок не поднимутся (см. keycloak.org observability)
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "false"
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-master}
    volumes:
      # Импорт реалма при старте: все *.json из keycloak-realm/ подхватываются Keycloak
      - ./keycloak-realm:/opt/keycloak/data/import
    command: start-dev --import-realm
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      # Если ключевой случай всё равно «unhealthy» (нет bash/curl/wget в образе), временно уберите
      # этот блок и в backend/nginx верните keycloak: condition: service_started — см. docker-compose.override.
      # В UBI-micro часто нет curl — цепочка заканчивается bash /dev/tcp :8080.
      test:
        [
          "CMD-SHELL",
          "curl -sfL --max-time 6 http://127.0.0.1:9000/q/health/ready >/dev/null 2>&1 || curl -sfL --max-time 6 http://127.0.0.1:9000/health/ready >/dev/null 2>&1 || curl -sfL --max-time 6 http://127.0.0.1:8080/auth/ >/dev/null 2>&1 || wget -q --spider --timeout=6 http://127.0.0.1:8080/auth/ 2>/dev/null || bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"
        ]
      interval: 15s
      timeout: 10s
      retries: 50
      start_period: 600s

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./irtran_server-main
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_NAME: ${MYSQL_DATABASE:-irtran}
      DATABASE_USER: ${MYSQL_USER:-irtran}
      DATABASE_PASSWORD: ${MYSQL_PASSWORD:-irtran}
      # URL, который указан в токене (issuer) — тот, к которому обращается браузер
      KEYCLOAK_AUTH_SERVER_URL: ${KEYCLOAK_AUTH_SERVER_URL:-http://localhost/auth}
      # URL для запроса JWKS из контейнера бэкенда (keycloak — имя сервиса в Docker)
      KEYCLOAK_JWKS_URL: http://keycloak:8080/auth
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-master}
      KEYCLOAK_RESOURCE: ${KEYCLOAK_RESOURCE:-irtran-client}
      # Данные администратора Keycloak, используемые backend для вызова Admin REST API
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Специальный код для повышения роли до преподавателя
      TEACHER_UPGRADE_CODE: ${TEACHER_UPGRADE_CODE:-CHANGE_ME_TEACHER_CODE}
      # Каталоги загрузок: каждый привязан к своему тому (файлы «Справочник» и «Сценарии» не смешиваются)
      REFERENCE_UPLOAD_DIR: /app/uploads/reference
      SCENARIOS_UPLOAD_DIR: /app/uploads/scenarios
      # Ретраи миграций при медленном старте MySQL
      MIGRATION_MAX_RETRIES: ${MIGRATION_MAX_RETRIES:-20}
      MIGRATION_RETRY_DELAY_SEC: ${MIGRATION_RETRY_DELAY_SEC:-5}
    volumes:
      # Том только для файлов вкладки «Справочник» — сохраняется при перезапуске контейнера
      - reference_uploads:/app/uploads/reference
      # Том только для файлов вкладки «Сценарии» — сохраняется при перезапуске контейнера
      - scenarios_uploads:/app/uploads/scenarios
    depends_on:
      mysql:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - app-network

  # Фронт в режиме production (собранный Vite).
  # После git pull выполните: docker compose build --no-cache frontend && docker compose up -d nginx
  frontend:
    build:
      context: ./IrTRAN-main
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-http://localhost/auth}
        VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM:-master}
        VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID:-irtran-client}
        # Инвалидация кэша Docker BuildKit (опционально): BUILD_DATE="$(date +%s)" docker compose build frontend
        BUILD_DATE: ${BUILD_DATE:-}
    depends_on:
      - backend
    networks:
      - app-network

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_started
      keycloak:
        condition: service_healthy
    networks:
      - app-network

volumes:
  mysql_data:
  postgres_data:
  # Файлы, загруженные во вкладке «Справочник» (не смешиваются со «Сценариями»)
  reference_uploads:
  # Файлы, загруженные во вкладке «Сценарии» (не смешиваются со «Справочником»)
  scenarios_uploads:

networks:
  app-network:
    driver: bridge
