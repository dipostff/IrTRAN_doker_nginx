user  nginx;
worker_processes  auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  client_max_body_size 50m;
  proxy_connect_timeout 900s;
  proxy_send_timeout 900s;
  proxy_read_timeout 900s;

  sendfile        on;
  tcp_nopush      on;
  tcp_nodelay     on;
  keepalive_timeout 65;
  types_hash_max_size 4096;
  server_tokens off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Timeweb / балансировщик терминирует HTTPS и шлёт на backend по HTTP.
  # $scheme будет "http" — для Keycloak и API нужен исходный протокол из заголовка.
  map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
  }

  upstream frontend_upstream {
    server frontend:80;
  }

  upstream backend_upstream {
    server backend:3000;
  }

  upstream keycloak_upstream {
    server keycloak:8080;
  }

  server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name app.otred.ru otred.ru _;

    # Общие заголовки для всех location (см. комментарий в /auth/)
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # Let's Encrypt (если certbot на самой VM)
    location ^~ /.well-known/acme-challenge/ {
      root /var/www/certbot;
      default_type "text/plain";
      try_files $uri =404;
    }

    location /auth/ {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port $server_port;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_pass http://keycloak_upstream;
    }

    location /api/ {
      proxy_connect_timeout 900s;
      proxy_send_timeout 900s;
      proxy_read_timeout 900s;
      proxy_pass http://backend_upstream;
    }

    location ~ ^/(requests_transportation|document_types|message_types|signs_sending|countries|legal_entities|ownerships|owners_non_public_railway|approvals_with_owner|cargo_groups|methods_submission|stations|sending|cargo|transport_package_types|rolling_stock_types|contracts|destination_indications|submission_schedules|send_numbers|payers|payer_types|send_types|speed_types)$ {
      proxy_connect_timeout 900s;
      proxy_send_timeout 900s;
      proxy_read_timeout 900s;
      proxy_pass http://backend_upstream;
    }

    location / {
      proxy_pass http://frontend_upstream;
    }
  }

  # Раскомментируйте после выпуска сертификата (certbot / панель Timeweb → файлы на VM):
  #
  # server {
  #   listen 443 ssl http2;
  #   listen [::]:443 ssl http2;
  #   server_name app.otred.ru;
  #
  #   ssl_certificate     /etc/letsencrypt/live/app.otred.ru/fullchain.pem;
  #   ssl_certificate_key /etc/letsencrypt/live/app.otred.ru/privkey.pem;
  #
  #   proxy_http_version 1.1;
  #   proxy_set_header Host $host;
  #   proxy_set_header X-Real-IP $remote_addr;
  #   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  #   proxy_set_header X-Forwarded-Proto https;
  #   proxy_set_header X-Forwarded-Host $host;
  #   proxy_set_header X-Forwarded-Port 443;
  #
  #   location /auth/ {
  #     proxy_set_header Upgrade $http_upgrade;
  #     proxy_set_header Connection $connection_upgrade;
  #     proxy_pass http://keycloak_upstream;
  #   }
  #   location /api/ {
  #     proxy_pass http://backend_upstream;
  #   }
  #   location ~ ^/(requests_transportation|document_types|message_types|signs_sending|countries|legal_entities|ownerships|owners_non_public_railway|approvals_with_owner|cargo_groups|methods_submission|stations|sending|cargo|transport_package_types|rolling_stock_types|contracts|destination_indications|submission_schedules|send_numbers|payers|payer_types|send_types|speed_types)$ {
  #     proxy_pass http://backend_upstream;
  #   }
  #   location / {
  #     proxy_pass http://frontend_upstream;
  #   }
  # }
}
